<ion-header>
  <ion-toolbar>
    <ion-title>Iniciar sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <ion-item>
      <ion-label position="floating">Correo electrónico</ion-label>
      <ion-input type="email" formControlName="email" inputmode="email"></ion-input>
    </ion-item>
    <ion-text color="danger" *ngIf="email.touched && email.invalid">
      <p *ngIf="email.errors?.['required']">El correo es obligatorio.</p>
      <p *ngIf="email.errors?.['email']">El formato del correo no es válido.</p>
    </ion-text>

    <ion-item>
      <ion-label position="floating">Contraseña</ion-label>
      <ion-input type="password" formControlName="password"></ion-input>
    </ion-item>
    <ion-text color="danger" *ngIf="password.touched && password.invalid">
      <p *ngIf="password.errors?.['required']">La contraseña es obligatoria.</p>
    </ion-text>

    <ion-text color="danger" *ngIf="errorMensaje">
      <p>{{ errorMensaje }}</p>
    </ion-text>

    <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="cargando">
      <ion-spinner *ngIf="cargando" name="dots"></ion-spinner>
      <span *ngIf="!cargando">Ingresar</span>
    </ion-button>

    <ion-button expand="block" fill="clear" routerLink="/clientes/registro">
      ¿No tenés cuenta? Registrate como cliente
    </ion-button>
  </form>
</ion-content>
