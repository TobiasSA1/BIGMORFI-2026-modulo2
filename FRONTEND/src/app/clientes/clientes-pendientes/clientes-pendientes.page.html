<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Clientes pendientes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="cargar($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="ion-text-center ion-padding" *ngIf="cargando && clientes.length === 0">
    <ion-spinner name="dots"></ion-spinner>
  </div>

  <ion-text class="ion-padding" *ngIf="!cargando && clientes.length === 0">
    <p>No hay clientes pendientes de aprobación.</p>
  </ion-text>

  <ion-list>
    <ion-item *ngFor="let cliente of clientes">
      <ion-avatar slot="start" class="avatar-cliente">
        <img *ngIf="cliente.foto_url" [src]="cliente.foto_url" [alt]="cliente.nombre" />
        <ion-icon *ngIf="!cliente.foto_url" name="person-circle-outline"></ion-icon>
      </ion-avatar>
      <ion-label>
        <h2>{{ cliente.apellido }}, {{ cliente.nombre }}</h2>
      </ion-label>
      <ion-button slot="end" color="success" fill="outline" (click)="abrirConfirmacion(cliente, 'aprobar')">
        Aceptar
      </ion-button>
      <ion-button slot="end" color="danger" fill="outline" (click)="abrirConfirmacion(cliente, 'rechazar')">
        Rechazar
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
